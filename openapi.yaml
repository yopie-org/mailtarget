  /v1/suppression:
    post:
      tags:
        - Suppression
      summary: POST /v1/suppression
      description: |
        Add an email address to the account-level suppression list. Suppressed addresses are blocked from receiving sends regardless of contact status.

        Common reasons to suppress: complaint received outside Mailtarget channels, compliance request for data subject opt-out, manual block of a known bad address.

        ## Related

        - The bounce-classification operations doc for automatic suppression policy.
        - [Errors and Rate Limits](/concepts/errors-and-rate-limits) for what happens when a send targets a suppressed recipient.
      operationId: suppression_post__v1_suppression
      security:
        - BearerAuth: []
      x-mailtarget-scope: settings.write
      x-mailtarget-tier: tier2
      x-mailtarget-internal: false
      x-mailtarget-idempotency-required: false
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      added:
                        type: integer
              example:
                data:
                  added: 2
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/suppression/{email}:
    delete:
      tags:
        - Suppression
      summary: DELETE /v1/suppression/{email}
      description: |
        Remove an email address from the suppression list. Sends to this address resume immediately on success.

        Only remove an address from suppression after confirming the underlying reason no longer applies. Removing a hard-bounce suppression without verifying the address is now valid will trigger a new hard bounce and damage domain reputation.

        ## Related

        - The bounce-classification operations doc for when removal is safe.
      operationId: suppression_delete__v1_suppression__email
      security:
        - BearerAuth: []
      x-mailtarget-scope: settings.write
      x-mailtarget-tier: tier2
      x-mailtarget-internal: false
      x-mailtarget-idempotency-required: false
      responses:
        200:
          description: OK
