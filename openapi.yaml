  /v2/email-marketing:
    get:
      tags:
        - Campaigns
      summary: GET email marketing.
      description: |
        List Email Marketing campaigns on the account with pagination and optional filters by status or category.

        ## Related

        - [Campaigns](/concepts/email-marketing/campaigns) for status lifecycle.
        - [Reports](/concepts/email-marketing/reports) for engagement aggregates per campaign.
      operationId: campaigns_get__v2_email_marketing
      security:
        - BearerAuth: []
      x-mailtarget-scope: campaigns.read
      x-mailtarget-tier: tier2
      x-mailtarget-internal: false
      x-mailtarget-idempotency-required: false
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      perPage:
                        type: integer
                      total:
                        type: integer
              example:
                data: {}
                meta:
                  page: 1
                  perPage: 20
                  total: 1
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: Forbidden scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        429:
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Campaigns
      summary: POST email marketing.
      description: |
        Create an Email Marketing campaign as a draft. Set subject, sender, body, recipients, optional schedule, and tracking. Status starts at `draft`. Send later via `/send` or directly via `/create-send`.

        ## Related

        - [Email Marketing overview](/concepts/email-marketing) for the campaign data model.
        - [Recipients](/concepts/email-marketing/recipients) for the targeting filter shape.
        - [Sending Domains](/concepts/sending-domains) for sender verification requirements.
      operationId: campaigns_post__v2_email_marketing
      security:
        - BearerAuth: []
      x-mailtarget-scope: campaigns.write
